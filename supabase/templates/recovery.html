<h2>Reset your Vurlo password</h2>
<p>Follow the link below to choose a new password. It works once and expires in one hour.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Choose a new password</a></p>
<p>If you didn't ask for this, you can ignore this email. Your password hasn't changed.</p>
